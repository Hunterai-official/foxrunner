<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fox Runner 3D</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to top left, #ff9f43, #000000);
      overflow: hidden;
    }
    #loader {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(to top left, #ff9f43, #000000);
      color: white;
      font-size: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #loader img {
      width: 160px;
      margin-bottom: 20px;
    }
    #startBtn {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 18px;
      background: #ff9f43;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: none;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="loader">
    <img src="https://i.imgur.com/MWsvKoO.png" alt="Logo" />
    <p>Loading...</p>
    <button id="startBtn">START</button>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
